<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INFP Evolution System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/script.js"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <i class="ph ph-feather"></i>
        </div>
        <div>
          <h1>INFP Evolution</h1>
          <p>Daily Operating System</p>
        </div>
      </div>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item active" data-route="dashboard">
          <i class="ph ph-squares-four"></i>
          <span>仪表盘</span>
        </button>
        <button class="nav-item" data-route="tasks">
          <i class="ph ph-check-circle"></i>
          <span>今日三任务</span>
        </button>
        <button class="nav-item" data-route="experiment">
          <i class="ph ph-flask"></i>
          <span>实验日志</span>
        </button>
        <button class="nav-item" data-route="academic">
          <i class="ph ph-trend-up"></i>
          <span>学术看板</span>
        </button>
        <button class="nav-item" data-route="fitness">
          <i class="ph barbell ph-barbell"></i>
          <span>健身记录</span>
        </button>
        <button class="nav-item" data-route="review">
          <i class="ph ph-moon"></i>
          <span>晚间复盘</span>
        </button>
        <button class="nav-item" data-route="weekly">
          <i class="ph ph-calendar-check"></i>
          <span>周度检查</span>
        </button>
        <button class="nav-item" data-route="history">
          <i class="ph ph-clock-counter-clockwise"></i>
          <span>历史记录</span>
        </button>
        <button class="nav-item" data-route="settings">
          <i class="ph ph-gear"></i>
          <span>设置</span>
        </button>
      </nav>

      <div class="sidebar-card">
        <span class="eyebrow">自动保存</span>
        <div class="save-indicator">
          <span class="save-dot"></span>
          <strong id="save-state">已就绪</strong>
        </div>
        <p id="storage-state">浏览器本地保存</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="date-line" id="today-line"></p>
          <h2 id="page-title">仪表盘</h2>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="theme-toggle" title="切换亮色/暗色模式" aria-label="切换亮色/暗色模式">
            <i class="ph ph-sun"></i>
          </button>
          <button class="soft-button" id="connect-folder">连接数据文件夹</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
